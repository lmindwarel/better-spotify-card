<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Better Spotify Card - Test Environment</title>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .preview-container {
      width: 100%;
      max-width: 450px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="preview-container">
    <h1>Preview: Better Spotify Card</h1>
    <better-spotify-card id="card"></better-spotify-card>
  </div>

  <script type="module" src="/src/better-spotify-card.ts"></script>
  <script type="module">
    const card = document.getElementById('card');
    
    // Mock Home Assistant
    const mockHass = {
      states: {
        'media_player.spotify_antoine_delaroue': {
          entity_id: 'media_player.spotify_antoine_delaroue',
          state: 'playing',
          attributes: {
            friendly_name: 'Spotify Antoine',
            media_title: 'Starboy',
            media_artist: 'The Weeknd, Daft Punk',
            media_album_name: 'Starboy',
            entity_picture: 'https://i.scdn.co/image/ab67616d0000b2734718e2b124f79258be7bc452',
            media_duration: 230,
            media_position: 65,
            media_position_updated_at: new Date().toISOString(),
            volume_level: 0.65,
            source: 'Samsung Soundbar Q70T',
            source_list: ['Samsung Soundbar Q70T', 'Echo Dot Salon', 'Téléphone Android']
          }
        }
      },
      callService: async (domain, service, data) => {
        console.log('Mock callService:', domain, service, data);
        if (service === 'volume_set') {
          mockHass.states['media_player.spotify_antoine_delaroue'].attributes.volume_level = data.volume_level;
          card.hass = { ...mockHass };
        } else if (service === 'media_play_pause') {
          const current = mockHass.states['media_player.spotify_antoine_delaroue'].state;
          mockHass.states['media_player.spotify_antoine_delaroue'].state = current === 'playing' ? 'paused' : 'playing';
          card.hass = { ...mockHass };
        }
      },
      callWS: async (msg) => {
        console.log('Mock callWS:', msg);
        if (msg.service === 'get_track_favorites') {
          return {
            response: {
              result: {
                items: [
                  {
                    track: {
                      id: '1',
                      name: 'Starboy',
                      uri: 'spotify:track:1',
                      duration_ms: 230000,
                      artists: [{ name: 'The Weeknd' }, { name: 'Daft Punk' }],
                      album: { name: 'Starboy', images: [{ url: 'https://i.scdn.co/image/ab67616d0000b2734718e2b124f79258be7bc452' }] }
                    }
                  },
                  {
                    track: {
                      id: '2',
                      name: 'Blinding Lights',
                      uri: 'spotify:track:2',
                      duration_ms: 200000,
                      artists: [{ name: 'The Weeknd' }],
                      album: { name: 'After Hours', images: [{ url: 'https://i.scdn.co/image/ab67616d0000b2738863bc11d2aa12b54f5aeb36' }] }
                    }
                  },
                  {
                    track: {
                      id: '3',
                      name: 'Midnight City',
                      uri: 'spotify:track:3',
                      duration_ms: 243000,
                      artists: [{ name: 'M83' }],
                      album: { name: 'Hurry Up, We\'re Dreaming', images: [{ url: 'https://i.scdn.co/image/ab67616d0000b273a048415db06a5b6fa7ec4e1a' }] }
                    }
                  }
                ]
              }
            }
          };
        } else if (msg.service === 'get_playlist_favorites') {
          return {
            response: {
              result: {
                items: [
                  {
                    id: 'pl1',
                    name: 'Mes coups de cœur 2026',
                    uri: 'spotify:playlist:pl1',
                    tracks: { total: 42 },
                    images: [{ url: 'https://i.scdn.co/image/ab67616d0000b2734718e2b124f79258be7bc452' }]
                  },
                  {
                    id: 'pl2',
                    name: 'Synthwave & Electro',
                    uri: 'spotify:playlist:pl2',
                    tracks: { total: 118 },
                    images: [{ url: 'https://i.scdn.co/image/ab67616d0000b2738863bc11d2aa12b54f5aeb36' }]
                  }
                ]
              }
            }
          };
        } else if (msg.service === 'get_spotify_connect_devices') {
          return {
            response: {
              result: [
                { id: 'dev1', name: 'Samsung Soundbar Q70T', is_active: true, type: 'Speaker', volume_percent: 65 },
                { id: 'dev2', name: 'Echo Dot Salon', is_active: false, type: 'Speaker', volume_percent: 50 },
                { id: 'dev3', name: 'Pixel 8 Pro (Antoine)', is_active: false, type: 'Smartphone', volume_percent: 80 }
              ]
            }
          };
        } else if (msg.service === 'search_tracks') {
          return {
            response: {
              result: {
                items: [
                  {
                    id: 's1',
                    name: `${msg.service_data?.criteria} (Live Edit)`,
                    uri: 'spotify:track:s1',
                    duration_ms: 215000,
                    artists: [{ name: 'Artiste Découverte' }],
                    album: { name: 'Album Test', images: [{ url: 'https://i.scdn.co/image/ab67616d0000b273a048415db06a5b6fa7ec4e1a' }] }
                  }
                ]
              }
            }
          };
        }
        return {};
      }
    };

    card.setConfig({
      entity: 'media_player.spotify_antoine_delaroue',
      default_tab: 'liked'
    });
    card.hass = mockHass;
  </script>
</body>
</html>
